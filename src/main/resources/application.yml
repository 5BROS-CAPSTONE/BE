spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fivebros-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: app
    schemas: app
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    sql-migration-prefix: ""
    sql-migration-separator: "_"
  mvc:
    problemdetails:
      enabled: true

server:
  # Railway tiêm sẵn biến PORT; SERVER_PORT dành cho máy local.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: false

app:
  auth:
    issuer: fivebros-backend
    jwt-secret: ${AUTH_JWT_SECRET:}
    token-ttl: ${AUTH_TOKEN_TTL:PT30M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:5BROS Administrator}
